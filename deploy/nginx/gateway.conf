map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $host $panel_root {
  default /usr/share/nginx/operator;
  admin.bookmybus.pro /usr/share/nginx/admin;
  partner.bookmybus.pro /usr/share/nginx/partner;
  owner.bookmybus.pro /usr/share/nginx/owner;
}
server {
  listen 8080 default_server;
  server_name _;
  location = /gateway-health { access_log off; return 200 'ok'; }
  location / { return 444; }
}
server {
  listen 8080;
  server_name bookmybus.pro admin.bookmybus.pro partner.bookmybus.pro owner.bookmybus.pro;
  root $panel_root;
  client_max_body_size 6m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /deployment-revision { alias /usr/share/nginx/revision.txt; add_header Cache-Control no-store; }
  location = /api/v1/public {
    if ($host != partner.bookmybus.pro) { return 404; }
    include /etc/nginx/bookmybus-public-test-proxy.inc;
  }
  # Signed server-to-server commands only; the receiver authenticates the body
  # and rechecks source membership. Browser login/password tokens are not proxied.
  location = /internal/sandbox-portal/execute {
    if ($host != partner.bookmybus.pro) { return 404; }
    include /etc/nginx/bookmybus-public-test-proxy.inc;
  }
  location = /internal/sandbox-portal/inventory-execute {
    if ($host != partner.bookmybus.pro) { return 404; }
    include /etc/nginx/bookmybus-public-test-proxy.inc;
  }
  location ^~ /api/v1/public/ {
    if ($host != partner.bookmybus.pro) { return 404; }
    include /etc/nginx/bookmybus-public-test-proxy.inc;
  }
  # Isolated provider-facing Car CRS sandbox. It intentionally has no path
  # overlap with the existing Bus CRS public API.
  location ^~ /api/v1/car/ {
    if ($host != partner.bookmybus.pro) { return 404; }
    include /etc/nginx/bookmybus-car-sandbox-proxy.inc;
  }
  location ^~ /api/v1/live-car/ {
    if ($host != partner.bookmybus.pro) { return 404; }
    include /etc/nginx/bookmybus-proxy.inc;
  }
  location /api/ { include /etc/nginx/bookmybus-proxy.inc; }
  location /socket.io/ { include /etc/nginx/bookmybus-proxy.inc; }
  location /assets/ { expires 1y; add_header Cache-Control 'public, immutable'; try_files $uri =404; }
  location / { add_header Cache-Control no-store; try_files $uri $uri/ /index.html; }
}
server {
  listen 8080;
  server_name api.bookmybus.pro;
  client_max_body_size 6m;
  location / { include /etc/nginx/bookmybus-proxy.inc; }
}
