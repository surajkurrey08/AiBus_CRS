# REVIEW ONLY. Do not copy/reload automatically. Install only after confirming
# this file's include path, certificate mount and Docker network on the shared
# gymproplus-nginx-1 container. Never replace its existing domain configuration.
# Docker resolver keeps the gateway address fresh after container replacement.
server {
  listen 80;
  listen [::]:80;
  server_name bookmybus.pro admin.bookmybus.pro partner.bookmybus.pro api.bookmybus.pro;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name bookmybus.pro admin.bookmybus.pro partner.bookmybus.pro api.bookmybus.pro;
  # THESE PATHS REQUIRE VERIFICATION and a SAN certificate covering all 4 hosts.
  ssl_certificate /etc/letsencrypt/live/bookmybus.pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bookmybus.pro/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $bookmybus_upstream bookmybus-crs-gateway:8080;
  client_max_body_size 6m;
  location / {
    proxy_pass http://$bookmybus_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Discard spoofable client forwarded headers at the public trust boundary.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_read_timeout 75s;
  }
}
