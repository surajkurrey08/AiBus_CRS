name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: 24.14.0
  MONGOMS_VERSION: 7.0.14
  # MongoDB 7 uses the Ubuntu 22.04 binary on the Ubuntu 24.04 hosted runner.
  MONGOMS_DISTRO: ubuntu-22.04
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:ci-env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:deployment
      - run: npm test
      - run: npm run build
      - name: Report quality result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Quality gates result — $RESULT" >> "$GITHUB_STEP_SUMMARY"
  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e:isolated
      - name: Report browser result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Isolated browser gates result — $RESULT" >> "$GITHUB_STEP_SUMMARY"
  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: |
          docker buildx build --platform linux/amd64 --load --target api --build-arg REVISION="$GITHUB_SHA" -t bookmybus-ci-api .
          docker buildx build --platform linux/amd64 --load --target web-production --build-arg REVISION="$GITHUB_SHA" -t bookmybus-ci-web .
          bash scripts/ci/image-smoke.sh bookmybus-ci-api bookmybus-ci-web "$GITHUB_SHA"
          bash scripts/ci/test-release-scripts.sh
      - name: Report Docker result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Docker gates result — $RESULT" >> "$GITHUB_STEP_SUMMARY"
