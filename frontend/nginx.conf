server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 6m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location /api/ { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_no_cache 1; proxy_cache_bypass 1; }
 location /socket.io/ { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 75s; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
 location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
